<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOUTHGATE CALC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="calculator">
      <h1 class="brand">Southgate Calc</h1>
      <div id="display" class="display" aria-live="polite">0</div>
      <div class="keypad" role="group" aria-label="Calculator keypad">
        <button type="button" class="key key-util" data-action="clear">C</button>
        <button type="button" class="key key-op" data-action="operator" data-value="÷">÷</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="7">7</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="8">8</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="9">9</button>
        <button type="button" class="key key-op" data-action="operator" data-value="×">×</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="4">4</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="5">5</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="6">6</button>
        <button type="button" class="key key-op" data-action="operator" data-value="−">−</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="1">1</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="2">2</button>
        <button type="button" class="key key-digit" data-action="digit" data-value="3">3</button>
        <button type="button" class="key key-op" data-action="operator" data-value="+">+</button>
        <button type="button" class="key key-digit key-zero" data-action="digit" data-value="0">0</button>
        <button type="button" class="key key-digit" data-action="decimal">.</button>
        <button type="button" class="key key-equals" data-action="equals">=</button>
      </div>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
